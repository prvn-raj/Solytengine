<link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/user_profile.css" />


<div class="page-content">
  <div class="profile-container">
    <div class="profile-header">
      <div class="avatar-circle"></div>
      <div>
        <h2 class="profile-title" id="profile-full-name"></h2>
        <p class="profile-subtitle">Your registered details on Solyte</p>
      </div>
    </div>

    <div class="profile-grid">
      <div><label>User ID:</label><span id="profile-user-id">-</span></div>
      <div><label>Name:</label><span id="profile-name">-</span></div>
      <div><label>Email:</label><span id="profile-email">-</span></div>
      <div><label>Phone:</label><span id="profile-phone">-</span></div>
      <div><label>Company:</label><span id="profile-company">-</span></div>
      <div><label>Department:</label><span id="profile-department">-</span></div>
      <div><label>Designation:</label><span id="profile-designation">-</span></div>
      <div><label>Employee ID:</label><span id="profile-employee-id">-</span></div>
      <div><label>Date of Birth:</label><span id="profile-dob">-</span></div>
      <div><label>Account Status:</label><span id="profile-status">-</span></div>
      <div><label>Created At:</label><span id="profile-created-at">-</span></div>
      <div><label>Updated At:</label><span id="profile-updated-at">-</span></div>
    </div>
  </div>
</div>
