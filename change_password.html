<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Change Password - Solyte</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="/js/change_password.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/change_password.css" />
</head>
<body>
  <form class="login" id="change-password-form">
    <img src="/assets/logo.png" alt="Solyte Logo" class="logo" />
    <input type="password" id="new-password" placeholder="New Password" required />
    <button type="submit">Update</button>
    <p id="status-message" class="error-message hidden"></p>
  </form>
</body>
</html>
